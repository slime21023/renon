    <!-- Box 2 -->
    <rect x="240" y="60" width="175" height="100" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="327" y="98" fill="#818cf8" font-size="15">src/lib/asciidoc.js</text>
    <text x="327" y="122" fill="#cbd5e1" font-size="12" font-weight="400">TOC JSON / KaTeX</text>
    <text x="327" y="142" fill="#cbd5e1" font-size="12" font-weight="400">Highlight.js / Tabs</text>

    <!-- Arrow 2 -->
    <line x1="415" y1="110" x2="455" y2="110" stroke="#64748b" stroke-width="2"/>
    <polygon points="455,105 465,110 455,115" fill="#64748b"/>

    <!-- Box 3 -->
    <rect x="465" y="60" width="160" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="545" y="102" fill="#34d399" font-size="15">WebC 元件系統</text>
    <text x="545" y="128" fill="#94a3b8" font-size="12" font-weight="400">doc.webc + @layer CSS</text>

    <!-- Arrow 3 -->
    <line x1="625" y1="110" x2="665" y2="110" stroke="#64748b" stroke-width="2"/>
    <polygon points="665,105 675,110 665,115" fill="#64748b"/>

    <!-- Box 4 -->
    <rect x="675" y="60" width="115" height="100" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="732" y="102" fill="#fbbf24" font-size="15">Pagefind</text>
