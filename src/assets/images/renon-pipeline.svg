    <text x="110" y="128" fill="#94a3b8" font-size="12" font-weight="400">原生屬性 + 語意語法</text>

    <!-- Arrow 1 -->
    <line x1="190" y1="110" x2="230" y2="110" stroke="#64748b" stroke-width="2"/>
