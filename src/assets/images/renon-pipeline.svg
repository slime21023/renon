<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img" aria-label="Renon 11ty + AsciiDoc + WebC 編譯管線圖">
  <rect width="820" height="220" rx="16" fill="#0f172a"/>
